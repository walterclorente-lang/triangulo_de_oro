<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta Regresiva - Media Maratón Triángulo de Oro 2026</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        overflow-x: hidden;

        background:
            linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url("fondo.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .container {
        background: rgba(0,0,0,0.6);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        width: 90%;
        max-width: 600px;
    }

    h1 {
        margin-bottom: 10px;
        color: #f7b500;
    }

    .countdown {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    .time-box {
        background: #f7b500;
        color: #000;
        padding: 20px;
        border-radius: 15px;
        min-width: 100px;
        font-size: 2rem;
        font-weight: bold;
    }

    .label {
        font-size: 0.9rem;
        margin-top: 5px;
        font-weight: normal;
    }

    /* Ajuste para celular */
    @media (max-width: 600px) {
        .time-box {
            width: 45%;
            padding: 15px;
            font-size: 1.5rem;
        }

        .container {
            padding: 25px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Media Maratón</h1>
    <h2>Triángulo de Oro 2026</h2>
    <p><strong>Domingo 22 de febrero de 2026 – 6:00 a. m.</strong></p>

    <div class="countdown">
        <div class="time-box">
            <div id="days">0</div>
            <div class="label">Días</div>
        </div>
        <div class="time-box">
            <div id="hours">0</div>
            <div class="label">Horas</div>
        </div>
        <div class="time-box">
            <div id="minutes">0</div>
            <div class="label">Minutos</div>
        </div>
        <div class="time-box">
            <div id="seconds">0</div>
            <div class="label">Segundos</div>
        </div>
    </div>
</div>

<script>
    // Fecha segura compatible con todos los navegadores
    const eventDate = new Date(2026, 1, 22, 6, 0, 0).getTime();

    const timer = setInterval(function() {
        const now = new Date().getTime();
        const distance = eventDate - now;

        if (distance > 0) {
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;
        } else {
            clearInterval(timer);
            document.querySelector(".countdown").innerHTML = "¡La carrera ha comenzado!";
        }
    }, 1000);
</script>

</body>
</html>
