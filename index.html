<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta Regresiva - Media Maratón Triángulo de Oro 2026</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        overflow-x: hidden;

        background:
            linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url("fondo.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .container {
        background: rgba(0,0,0,0.6);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        width: 90%;
        max-width: 600px;
    }

    h1 {
        margin-bottom: 10px;
        color: #f7b500;
    }

    .countdown {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    .time-box {
        background: #f7b500;
        color: #000;
        padding: 20px;
        border-radius: 15px;
        min-width: 100px;
        font-size: 2rem;
        font-weight: bold;
    }

    .label {
        font-size: 0.9rem;
        margin-top: 5px;
        font-weight: normal;
    }

    /* Botón Like */
    .like-section {
        margin-top: 30px;
    }

    .like-btn {
        font-size: 18px;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: #1877f2;
        color: white;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.3s ease;
    }

    .like-btn:hover {
        background: #145bd1;
    }

    .like-btn:active {
        transform: scale(0.95);
    }

    .like-count {
        margin-top: 10px;
        font-size: 22px;
        font-weight: bold;
    }

    .pop {
        animation: pop 0.3s ease;
    }

    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); }
        100% { transform: scale(1); }
    }

    @media (max-width: 600px) {
        .time-box {
            width: 45%;
            padding: 15px;
            font-size: 1.5rem;
        }

        .container {
            padding: 25px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Media Maratón</h1>
    <h2>Triángulo de Oro 2026</h2>
    <p><strong>Domingo 22 de febrero de 2026 – 6:00 a. m.</strong></p>
    <p><strong>Run Squad ¡Listos!</strong></p>

    <div class="countdown">
        <div class="time-box">
            <div id="days">0</div>
            <div class="label">Días</div>
        </div>
        <div class="time-box">
            <div id="hours">0</div>
            <div class="label">Horas</div>
        </div>
        <div class="time-box">
            <div id="minutes">0</div>
            <div class="label">Minutos</div>
        </div>
        <div class="time-box">
            <div id="seconds">0</div>
            <div class="label">Segundos</div>
        </div>
    </div>

    <!-- Sección Like -->
    <div class="like-section">
        <button class="like-btn" onclick="darLike()">👍 Me gusta el evento</button>
        <div class="like-count">Likes: <span id="contador">0</span></div>
    </div>
</div>

<!-- Cuenta regresiva -->
<script>
    const eventDate = new Date(2026, 1, 22, 6, 0, 0).getTime();

    const timer = setInterval(function() {
        const now = new Date().getTime();
        const distance = eventDate - now;

        if (distance > 0) {
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;
        } else {
            clearInterval(timer);
            document.querySelector(".countdown").innerHTML = "¡La carrera ha comenzado!";
        }
    }, 1000);
</script>

<!-- Firebase Likes -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDZO38ndP94qMH1Jqf4roAIcWJ5LltIlJw",
    authDomain: "contador-de-like-a0496.firebaseapp.com",
    projectId: "contador-de-like-a0496",
    storageBucket: "contador-de-like-a0496.firebasestorage.app",
    messagingSenderId: "867412678475",
    appId: "1:867412678475:web:c4a87c8a2e45a9538cbace"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const likeRef = doc(db, "likes", "mediaMaraton2026");

const contadorSpan = document.getElementById("contador");

// Crear documento si no existe
async function iniciar() {
    const snap = await getDoc(likeRef);
    if (!snap.exists()) {
        await setDoc(likeRef, { total: 0 });
    }
}
iniciar();

// Escuchar cambios en tiempo real
onSnapshot(likeRef, (snap) => {
    if (snap.exists()) {
        contadorSpan.innerText = snap.data().total;
    }
});

// Evitar spam rápido
let bloqueado = false;

window.darLike = async function() {
    if (bloqueado) return;
    bloqueado = true;

    const snap = await getDoc(likeRef);
    const nuevoTotal = snap.data().total + 1;
    await updateDoc(likeRef, { total: nuevoTotal });

    contadorSpan.classList.add("pop");
    setTimeout(() => contadorSpan.classList.remove("pop"), 300);

    setTimeout(() => bloqueado = false, 1000);
};
</script>

</body>
</html>
