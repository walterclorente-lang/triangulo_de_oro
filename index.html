<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta Regresiva - Media Maratón Triángulo de Oro 2026</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }
    .container {
        background: rgba(0,0,0,0.6);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    h1 {
        margin-bottom: 10px;
        color: #f7b500;
    }
    .countdown {
        display: flex;
        justify-content: center;
        gap: 20px;
        font-size: 2rem;
        margin-top: 20px;
    }
    .time-box {
        background: #f7b500;
        color: #000;
        padding: 20px;
        border-radius: 15px;
        min-width: 90px;
    }
    .label {
        font-size: 0.9rem;
        margin-top: 5px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Media Maratón</h1>
    <h2>Triángulo de Oro 2026</h2>
    <p>22 de Febrero 2026 - 6:00 AM</p>

    <div class="countdown">
        <div class="time-box">
            <div id="days">0</div>
            <div class="label">Días</div>
        </div>
        <div class="time-box">
            <div id="hours">0</div>
            <div class="label">Horas</div>
        </div>
        <div class="time-box">
            <div id="minutes">0</div>
            <div class="label">Minutos</div>
        </div>
        <div class="time-box">
            <div id="seconds">0</div>
            <div class="label">Segundos</div>
        </div>
    </div>
</div>

<script>
    const eventDate = new Date("February 22, 2026 06:00:00").getTime();

    const timer = setInterval(function() {
        const now = new Date().getTime();
        const distance = eventDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerHTML = days;
        document.getElementById("hours").innerHTML = hours;
        document.getElementById("minutes").innerHTML = minutes;
        document.getElementById("seconds").innerHTML = seconds;

        if (distance < 0) {
            clearInterval(timer);
            document.querySelector(".countdown").innerHTML = "¡La carrera ha comenzado!";
        }
    }, 1000);
</script>

</body>
</html>
