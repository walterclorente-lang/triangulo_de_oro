<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta Regresiva - Media Maratón Triángulo de Oro 2026</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        overflow-x: hidden;

        background:
            linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url("fondo.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .container {
        background: rgba(0,0,0,0.6);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        width: 90%;
        max-width: 600px;
    }

    h1 {
        margin-bottom: 10px;
        color: #f7b500;
    }

    .countdown {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap; /* 🔥 Permite que se acomode en celular */
    }

    .time-box {
        background: #f7b500;
        color: #000;
        padding: 20px;
        border-radius: 15px;
        min-width: 100px;
        font-size: 2rem;
    }

    .label {
        font-size: 0.9rem;
        margin-top: 5px;
    }

    /* 🔥 Ajustes para celular */
    @media (max-width: 600px) {
        .time-box {
            width: 45%;
            padding: 15px;
            font-size: 1.5rem;
        }

        .container {
            padding: 25px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Media Maratón</h1>
    <h2>Triángulo de Oro 2026</h2>
    <p>22 de Febrero 2026 - 6:00 AM</p>

    <div class="countdown">
        <div class="time-box">
            <div id="days">0</div>
            <div class="label">Días</div>
        </div>
        <div class="time-box">
            <div id="hours">0</div>
            <div class="label">Horas</div>
